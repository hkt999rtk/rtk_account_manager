services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rtk_account_manager
      POSTGRES_USER: rtk
      POSTGRES_PASSWORD: rtk_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtk -d rtk_account_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
