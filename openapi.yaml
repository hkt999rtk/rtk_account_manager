openapi: 3.0.3
info:
  title: RTK Account Manager API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /v1/health:
    get:
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/register:
    post:
      summary: Register a user and initial organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      summary: Login with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/refresh:
    post:
      summary: Exchange a refresh token for new tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      security:
        - bearerAuth: []
      summary: Revoke a refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      security:
        - bearerAuth: []
      summary: Get current user and organization memberships.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me/password:
    patch:
      security:
        - bearerAuth: []
      summary: Change the current user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and active refresh tokens revoked.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/orgs:
    get:
      security:
        - bearerAuth: []
      summary: List current user's organizations.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Organization list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationsResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      summary: Create an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}:
    get:
      security:
        - bearerAuth: []
      summary: Get organization details.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Organization details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      security:
        - bearerAuth: []
      summary: Update organization details.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/members:
    get:
      security:
        - bearerAuth: []
      summary: List organization members.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Member list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      summary: Add an existing user to an organization.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Member added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/members/{userId}:
    patch:
      security:
        - bearerAuth: []
      summary: Update member role.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Remove member from organization.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Member removed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/members/{userId}/disable:
    patch:
      security:
        - bearerAuth: []
      summary: Disable a member user account.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Member disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/members/{userId}/enable:
    patch:
      security:
        - bearerAuth: []
      summary: Enable a disabled member user account.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Member enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/device-groups:
    get:
      security:
        - bearerAuth: []
      summary: List organization device groups.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Device group list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      summary: Create device group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGroupRequest"
      responses:
        "201":
          description: Device group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/device-groups/{groupId}:
    get:
      security:
        - bearerAuth: []
      summary: Get device group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Device group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      security:
        - bearerAuth: []
      summary: Update device group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGroupRequest"
      responses:
        "200":
          description: Device group updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Delete device group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Device group deleted.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/device-groups/{groupId}/devices:
    get:
      security:
        - bearerAuth: []
      summary: List devices assigned to a group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Group device list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/device-groups/{groupId}/devices/{deviceId}:
    put:
      security:
        - bearerAuth: []
      summary: Add device to group.
      description: Repeating the same assignment is idempotent. Disabled registry devices may remain selectable.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device assigned to group.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Remove device from group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device removed from group.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices:
    get:
      security:
        - bearerAuth: []
      summary: List organization devices.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Device list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      summary: Create device.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRequest"
      responses:
        "201":
          description: Device created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}:
    get:
      security:
        - bearerAuth: []
      summary: Get device details.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      security:
        - bearerAuth: []
      summary: Update device.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRequest"
      responses:
        "200":
          description: Device updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Delete device.
      description: Soft-disable the account-manager registry device record only. This route does not start product-level video deactivation.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device soft-disabled.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/tags:
    get:
      security:
        - bearerAuth: []
      summary: List device tags.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Device tag list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTagsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/tags/{tag}:
    put:
      security:
        - bearerAuth: []
      summary: Add device tag.
      description: Repeating the same tag assignment is idempotent.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Tag"
      responses:
        "200":
          description: Device tag assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTagResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Remove device tag.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Tag"
      responses:
        "204":
          description: Device tag removed.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/provision:
    post:
      security:
        - bearerAuth: []
      summary: Create or reuse a provisioning operation.
      description: >
        Starts account-side claim/bind provisioning for an existing enabled
        organization-owned registry device. The current API accepts normalized
        Realtek video claim material only; raw QR, serial-number,
        activation-code, transfer, and factory-reset reclaim flows are out of
        scope. Registry ownership remains scoped to the addressed organization
        and account-manager device id.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionDeviceRequest"
      responses:
        "200":
          description: Existing provisioning operation returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "201":
          description: Provisioning operation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/provisioning:
    get:
      security:
        - bearerAuth: []
      summary: Get latest provisioning state, account-side readiness, and projected video metadata.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Provisioning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningStateResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/deactivate:
    post:
      security:
        - bearerAuth: []
      summary: Create or reuse a deactivation operation.
      description: Start product-level video teardown by enqueuing `DeviceDeactivateRequested`. This route is distinct from registry soft-delete.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateDeviceRequest"
      responses:
        "200":
          description: Existing deactivation operation returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "201":
          description: Deactivation operation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/status:
    patch:
      security:
        - bearerAuth: []
      summary: Update device status.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceStatusRequest"
      responses:
        "200":
          description: Device status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Tag:
      name: tag
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    RegisterRequest:
      type: object
      required: [email, password, organization_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
        organization_name:
          type: string
          minLength: 1
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: Current password for the authenticated user.
        new_password:
          type: string
          minLength: 8
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    UpdateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    DeviceRequest:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/DeviceCategory"
        serial_number:
          type: string
        mac_address:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        metadata:
          type: object
          additionalProperties: true
    DeviceGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    UpdateDeviceStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/DeviceStatus"
        last_seen_at:
          type: string
          format: date-time
    ProvisionDeviceRequest:
      type: object
      description: >
        Existing-device Realtek video provisioning request. This schema does not
        accept standalone `claim_material`, SDK-normalized `qr_payload`,
        serial number, activation code, MAC address, or factory identity fields;
        those claim/bind flows require a future dedicated endpoint or owner
        service.
      required: [video_cloud_devid, activity_id, clip_public_key]
      additionalProperties: false
      properties:
        video_cloud_devid:
          type: string
          minLength: 1
          description: Normalized Realtek video device identity to bind to the account-manager registry device.
        activity_id:
          type: string
          minLength: 1
          description: Video-side activation activity identifier supplied by the onboarding flow.
        clip_public_key:
          type: string
          minLength: 1
          description: Public key material forwarded to the video-side lifecycle worker for activation.
        operation_id:
          type: string
          description: Optional client idempotency key; reuse with different claim material returns 409 Conflict.
    DeactivateDeviceRequest:
      type: object
      properties:
        operation_id:
          type: string
        reason:
          type: string
    RegisterResponse:
      type: object
      required: [user, organization, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organization:
          $ref: "#/components/schemas/Organization"
        tokens:
          $ref: "#/components/schemas/Tokens"
    LoginResponse:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/Tokens"
    RefreshResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          $ref: "#/components/schemas/Tokens"
    MeResponse:
      type: object
      required: [user, organizations]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
    OrganizationsResponse:
      type: object
      required: [organizations, pagination]
      properties:
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        pagination:
          $ref: "#/components/schemas/Pagination"
    OrganizationResponse:
      type: object
      required: [organization]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
    MembersResponse:
      type: object
      required: [members, pagination]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        pagination:
          $ref: "#/components/schemas/Pagination"
    MemberResponse:
      type: object
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/Member"
    DevicesResponse:
      type: object
      required: [devices, pagination]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        pagination:
          $ref: "#/components/schemas/Pagination"
    DeviceResponse:
      type: object
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/Device"
    DeviceGroupsResponse:
      type: object
      required: [groups, pagination]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/DeviceGroup"
        pagination:
          $ref: "#/components/schemas/Pagination"
    DeviceGroupResponse:
      type: object
      required: [group]
      properties:
        group:
          $ref: "#/components/schemas/DeviceGroup"
    DeviceTagsResponse:
      type: object
      required: [tags, pagination]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/DeviceTag"
        pagination:
          $ref: "#/components/schemas/Pagination"
    DeviceTagResponse:
      type: object
      required: [tag]
      properties:
        tag:
          $ref: "#/components/schemas/DeviceTag"
    DeviceOperationResponse:
      type: object
      required: [operation]
      properties:
        operation:
          $ref: "#/components/schemas/DeviceOperationSummary"
    ProvisioningStateResponse:
      type: object
      required: [operation, readiness, video_metadata]
      properties:
        operation:
          $ref: "#/components/schemas/DeviceOperationSummary"
        readiness:
          $ref: "#/components/schemas/DeviceReadinessProjection"
        video_metadata:
          type: object
          additionalProperties: true
    DeviceReadinessProjection:
      type: object
      required: [state, sources]
      properties:
        state:
          $ref: "#/components/schemas/DeviceReadinessState"
        sources:
          type: object
          required: [device_enabled, device_status, provisioning_operation_status]
          properties:
            device_enabled:
              type: boolean
            device_status:
              $ref: "#/components/schemas/DeviceStatus"
            provisioning_operation_status:
              $ref: "#/components/schemas/DeviceOperationStatus"
            video_cloud_activation_status:
              $ref: "#/components/schemas/VideoCloudActivationStatus"
            deactivation_operation_status:
              $ref: "#/components/schemas/DeviceOperationStatus"
            video_cloud_last_error:
              type: object
              nullable: true
              additionalProperties: true
    User:
      type: object
      required: [id, email, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
    Organization:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Member:
      type: object
      required: [organization_id, user_id, email, role, created_at, updated_at]
      properties:
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
    Device:
      type: object
      required: [id, organization_id, name, category, status, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: "#/components/schemas/DeviceCategory"
        serial_number:
          type: string
        mac_address:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        status:
          $ref: "#/components/schemas/DeviceStatus"
        last_seen_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
    DeviceGroup:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        device_count:
          type: integer
          minimum: 0
    DeviceTag:
      type: object
      required: [organization_id, device_id, tag, created_at, updated_at]
      properties:
        organization_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        tag:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeviceOperationSummary:
      type: object
      required: [operation_id, correlation_id, message_id, device_id, operation_type, status, created_at, updated_at]
      properties:
        operation_id:
          type: string
        correlation_id:
          type: string
        message_id:
          type: string
        device_id:
          type: string
          format: uuid
        operation_type:
          $ref: "#/components/schemas/DeviceOperationType"
        status:
          $ref: "#/components/schemas/DeviceOperationStatus"
        requested_by:
          type: string
        error_code:
          type: string
        error_message:
          type: string
        retryable:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    Tokens:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_token_expires_at:
          type: string
          format: date-time
    Pagination:
      type: object
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    Role:
      type: string
      enum: [owner, admin, member]
    DeviceCategory:
      type: string
      enum: [ip_camera, mqtt_device, generic]
    DeviceStatus:
      type: string
      enum: [unknown, online, offline, disabled]
    VideoCloudActivationStatus:
      type: string
      enum: [pending, activated, failed, deactivated]
    DeviceOperationType:
      type: string
      enum: [provision, deactivate]
    DeviceOperationStatus:
      type: string
      enum: [pending, published, succeeded, failed, retrying, dead_lettered]
    DeviceReadinessState:
      type: string
      enum: [activation_pending, activation_failed, transport_pending, ready, deactivation_pending, deactivation_failed, deactivated, disabled]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
