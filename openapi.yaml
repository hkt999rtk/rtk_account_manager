          type: string
          minLength: 1
          description: Normalized Realtek video device identity to bind to the account-manager registry device. Video-side credentials are scoped to this identity, not to the registry category.
        activity_id:
          type: string
          minLength: 1
          description: Video-side activation activity identifier supplied by the onboarding flow.
        clip_public_key:
          type: string
          minLength: 1
          description: Public key material forwarded to the video-side lifecycle worker for activation.
        service_options:
          $ref: "#/components/schemas/NonEmptyServiceOptions"
        operation_id:
          type: string
          description: Optional client idempotency key; reuse with different claim material returns 409 Conflict.
