openapi: 3.0.3
info:
  title: RTK Account Manager API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /v1/health:
    get:
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/register:
    post:
      summary: Register a user and initial organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/signup:
    post:
      summary: Create a public evaluation-tier account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Signup accepted and verification token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      summary: Login with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/refresh:
    post:
      summary: Exchange a refresh token for new tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/verify-email:
    post:
      summary: Verify a user's email with an OTP token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/resend-verification:
    post:
      summary: Issue a replacement email verification token.
      description: Returns the same status for unknown, already verified, disabled, or throttled users to avoid account enumeration. Token delivery is owned by the configured server-side AuthTokenSink adapter, not by the HTTP response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Verification resend accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/forgot-password:
    post:
      summary: Issue a self-service password reset token.
      description: Returns the same status for unknown, disabled, or throttled users to avoid account enumeration. Token delivery is owned by the configured server-side AuthTokenSink adapter, not by the HTTP response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Password reset request accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/reset-password:
    post:
      summary: Reset a user's password with a reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset and active refresh tokens revoked.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      security:
        - bearerAuth: []
      summary: Revoke a refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      security:
        - bearerAuth: []
      summary: Get current user and organization memberships.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Disable the current user account.
      description: Soft-disables the authenticated user, revokes active refresh tokens, and refuses to disable the user while they are the last active owner of any organization. This does not delete organizations, memberships, devices, or product-level device state.
      responses:
        "204":
          description: Current user disabled and active refresh tokens revoked.
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/me/password:
    patch:
      security:
        - bearerAuth: []
      summary: Change the current user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and active refresh tokens revoked.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/orgs:
    get:
      security:
        - bearerAuth: []
      summary: List current user's organizations.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Organization list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationsResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      summary: Create an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}:
    get:
      security:
        - bearerAuth: []
      summary: Get organization details.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Organization details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      security:
        - bearerAuth: []
      summary: Update organization details.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/quota-raise-requests:
    post:
      security:
        - bearerAuth: []
      summary: Request an evaluation quota increase.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaRaiseRequestRequest"
      responses:
        "201":
          description: Quota-raise request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaRaiseRequestResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/quota-raise-requests/{requestId}/approve:
    post:
      security:
        - bearerAuth: []
      summary: Approve a pending quota-raise request.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaRaiseDecisionRequest"
      responses:
        "200":
          description: Quota-raise request approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaRaiseDecisionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/quota-raise-requests/{requestId}/decline:
    post:
      security:
        - bearerAuth: []
      summary: Decline a pending quota-raise request.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaRaiseDecisionRequest"
      responses:
        "200":
          description: Quota-raise request declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaRaiseDecisionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/metrics:
    get:
      security:
        - bearerAuth: []
      summary: Get evaluation-tier signup and quota metrics.
      responses:
        "200":
          description: Evaluation-tier metrics snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalTierMetricsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/members:
    get:
      security:
        - bearerAuth: []
      summary: List organization members.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Member list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      summary: Add an existing user to an organization.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Member added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/members/{userId}:
    patch:
      security:
        - bearerAuth: []
      summary: Update member role.
      description: Refuses to downgrade the last active organization owner. Disabled owner memberships do not satisfy the active-owner invariant.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Remove member from organization.
      description: Refuses to remove the last active organization owner. Disabled owner memberships do not satisfy the active-owner invariant.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Member removed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/members/{userId}/disable:
    patch:
      security:
        - bearerAuth: []
      summary: Disable a member user account.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Member disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/members/{userId}/enable:
    patch:
      security:
        - bearerAuth: []
      summary: Enable a disabled member user account.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Member enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/device-groups:
    get:
      security:
        - bearerAuth: []
      summary: List organization device groups.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Device group list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      summary: Create device group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGroupRequest"
      responses:
        "201":
          description: Device group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/device-groups/{groupId}:
    get:
      security:
        - bearerAuth: []
      summary: Get device group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Device group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      security:
        - bearerAuth: []
      summary: Update device group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGroupRequest"
      responses:
        "200":
          description: Device group updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Delete device group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Device group deleted.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/device-groups/{groupId}/devices:
    get:
      security:
        - bearerAuth: []
      summary: List devices assigned to a group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Group device list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/device-groups/{groupId}/devices/{deviceId}:
    put:
      security:
        - bearerAuth: []
      summary: Add device to group.
      description: Repeating the same assignment is idempotent. Disabled registry devices may remain selectable.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device assigned to group.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Remove device from group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device removed from group.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices:
    get:
      security:
        - bearerAuth: []
      summary: List organization devices.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Device list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      summary: Create device.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRequest"
      responses:
        "201":
          description: Device created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/claim/resolve:
    post:
      security:
        - bearerAuth: []
      summary: Resolve a device Claim Token.
      description: >
        Resolves an account-manager-owned Claim Token into an
        organization-owned registry device and returns the normalized video
        provisioning input. This endpoint does not create a provisioning
        operation, publish outbox messages, or call the Realtek video service.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimResolveRequest"
            examples:
              claim_token:
                value:
                  claim_token: claim-token-from-qr
                  device_name: Front Door Camera
      responses:
        "201":
          description: Claim Token resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResolveResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}:
    get:
      security:
        - bearerAuth: []
      summary: Get device details.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      security:
        - bearerAuth: []
      summary: Update device.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRequest"
      responses:
        "200":
          description: Device updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Delete device.
      description: Soft-disable the account-manager registry device record only. This route does not start product-level video deactivation.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device soft-disabled.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/tags:
    get:
      security:
        - bearerAuth: []
      summary: List device tags.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Device tag list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTagsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/tags/{tag}:
    put:
      security:
        - bearerAuth: []
      summary: Add device tag.
      description: Repeating the same tag assignment is idempotent.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Tag"
      responses:
        "200":
          description: Device tag assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTagResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Remove device tag.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Tag"
      responses:
        "204":
          description: Device tag removed.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/provision:
    post:
      security:
        - bearerAuth: []
      summary: Create or reuse a provisioning operation.
      description: >
        Starts account-side claim/bind provisioning for an existing enabled
        organization-owned registry device. The current API accepts normalized
        Realtek video claim material only; raw QR, serial-number,
        activation-code, transfer, and factory-reset reclaim flows are out of
        scope. Registry ownership remains scoped to the addressed organization
        and account-manager device id.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionDeviceRequest"
      responses:
        "200":
          description: Existing provisioning operation returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "201":
          description: Provisioning operation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/provisioning:
    get:
      security:
        - bearerAuth: []
      summary: Get latest provisioning state, account-side readiness, and projected video metadata.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Provisioning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningStateResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/deactivate:
    post:
      security:
        - bearerAuth: []
      summary: Create or reuse a deactivation operation.
      description: Start product-level video teardown by enqueuing `DeviceDeactivateRequested`. This route is distinct from registry soft-delete.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateDeviceRequest"
      responses:
        "200":
          description: Existing deactivation operation returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "201":
          description: Deactivation operation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/status:
    patch:
      security:
        - bearerAuth: []
      summary: Update device status.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceStatusRequest"
      responses:
        "200":
          description: Device status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Tag:
      name: tag
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    RegisterRequest:
      type: object
      required: [email, password, organization_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
        organization_name:
          type: string
          minLength: 1
    SignupRequest:
      type: object
      required: [email, password, organization_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
        organization_name:
          type: string
          minLength: 1
        captcha_token:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    AuthTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 8
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: Current password for the authenticated user.
        new_password:
          type: string
          minLength: 8
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    UpdateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    DeviceRequest:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/DeviceCategory"
        serial_number:
          type: string
        mac_address:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        metadata:
          type: object
          additionalProperties: true
    DeviceGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    UpdateDeviceStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/DeviceStatus"
        last_seen_at:
          type: string
          format: date-time
    ProvisionDeviceRequest:
      type: object
      description: >
        Existing-device Realtek video provisioning request. This schema does not
        accept standalone `claim_material`, SDK-normalized `qr_payload`,
        serial number, activation code, MAC address, or factory identity fields;
        those claim/bind flows require a future dedicated endpoint or owner
        service.
      required: [video_cloud_devid, activity_id, clip_public_key]
      additionalProperties: false
      properties:
        video_cloud_devid:
          type: string
          minLength: 1
          description: Normalized Realtek video device identity to bind to the account-manager registry device.
        activity_id:
          type: string
          minLength: 1
          description: Video-side activation activity identifier supplied by the onboarding flow.
        clip_public_key:
          type: string
          minLength: 1
          description: Public key material forwarded to the video-side lifecycle worker for activation.
        operation_id:
          type: string
          description: Optional client idempotency key; reuse with different claim material returns 409 Conflict.
    ClaimResolveRequest:
      type: object
      required: [claim_token, device_name]
      additionalProperties: false
      properties:
        claim_token:
          type: string
          minLength: 1
          description: Raw Claim Token scanned from onboarding material. The server hashes this value before lookup.
        device_name:
          type: string
          minLength: 1
          description: Registry device name to use when the claim creates a new device.
    ClaimProvisionInput:
      type: object
      required: [video_cloud_devid, activity_id, clip_public_key]
      properties:
        video_cloud_devid:
          type: string
        activity_id:
          type: string
        clip_public_key:
          type: string
    ClaimResolveResponse:
      type: object
      required: [claim_id, device, provision_input]
      properties:
        claim_id:
          type: string
          format: uuid
        device:
          $ref: "#/components/schemas/Device"
        provision_input:
          $ref: "#/components/schemas/ClaimProvisionInput"
    DeactivateDeviceRequest:
      type: object
      properties:
        operation_id:
          type: string
        reason:
          type: string
    QuotaRaiseRequestRequest:
      type: object
      required: [requested_quota, use_case, contact_info]
      properties:
        requested_quota:
          type: integer
          minimum: 1
          maximum: 200
        use_case:
          type: string
          minLength: 1
        contact_info:
          type: object
          additionalProperties: true
    QuotaRaiseDecisionRequest:
      type: object
      properties:
        approved_quota:
          type: integer
          minimum: 1
          maximum: 200
        decision_reason:
          type: string
    RegisterResponse:
      type: object
      required: [user, organization, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organization:
          $ref: "#/components/schemas/Organization"
        tokens:
          $ref: "#/components/schemas/Tokens"
    SignupResponse:
      type: object
      required: [user, organization]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organization:
          $ref: "#/components/schemas/Organization"
    LoginResponse:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/Tokens"
    RefreshResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          $ref: "#/components/schemas/Tokens"
    MeResponse:
      type: object
      required: [user, organizations]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    OrganizationsResponse:
      type: object
      required: [organizations, pagination]
      properties:
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        pagination:
          $ref: "#/components/schemas/Pagination"
    OrganizationResponse:
      type: object
      required: [organization]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
    QuotaRaiseRequestResponse:
      type: object
      required: [quota_raise_request]
      properties:
        quota_raise_request:
          $ref: "#/components/schemas/QuotaRaiseRequest"
    QuotaRaiseDecisionResponse:
      type: object
      required: [quota_raise_request, organization]
      properties:
        quota_raise_request:
          $ref: "#/components/schemas/QuotaRaiseRequest"
        organization:
          $ref: "#/components/schemas/Organization"
    EvalTierMetricsResponse:
      type: object
      required: [signups, quota_raise_requests, evaluation_quota_usage]
      properties:
        signups:
          type: object
          required: [evaluation_created, commercial_created, verification_completed, verification_completion_rate]
          properties:
            evaluation_created:
              type: integer
              format: int64
              minimum: 0
            commercial_created:
              type: integer
              format: int64
              minimum: 0
            verification_completed:
              type: integer
              format: int64
              minimum: 0
            verification_completion_rate:
              type: number
              format: double
              minimum: 0
        quota_raise_requests:
          type: object
          required: [pending, approved, declined]
          properties:
            pending:
              type: integer
              format: int64
              minimum: 0
            approved:
              type: integer
              format: int64
              minimum: 0
            declined:
              type: integer
              format: int64
              minimum: 0
        evaluation_quota_usage:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationQuotaUsage"
    EvaluationQuotaUsage:
      type: object
      required: [organization_id, organization_name, active_devices, evaluation_device_quota, utilization]
      properties:
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        active_devices:
          type: integer
          format: int32
          minimum: 0
        evaluation_device_quota:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        utilization:
          type: number
          format: double
          minimum: 0
    MembersResponse:
      type: object
      required: [members, pagination]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        pagination:
          $ref: "#/components/schemas/Pagination"
    MemberResponse:
      type: object
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/Member"
    DevicesResponse:
      type: object
      required: [devices, pagination]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        pagination:
          $ref: "#/components/schemas/Pagination"
    DeviceResponse:
      type: object
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/Device"
    DeviceGroupsResponse:
      type: object
      required: [groups, pagination]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/DeviceGroup"
        pagination:
          $ref: "#/components/schemas/Pagination"
    DeviceGroupResponse:
      type: object
      required: [group]
      properties:
        group:
          $ref: "#/components/schemas/DeviceGroup"
    DeviceTagsResponse:
      type: object
      required: [tags, pagination]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/DeviceTag"
        pagination:
          $ref: "#/components/schemas/Pagination"
    DeviceTagResponse:
      type: object
      required: [tag]
      properties:
        tag:
          $ref: "#/components/schemas/DeviceTag"
    DeviceOperationResponse:
      type: object
      required: [operation]
      properties:
        operation:
          $ref: "#/components/schemas/DeviceOperationSummary"
    ProvisioningStateResponse:
      type: object
      required: [operation, readiness, video_metadata]
      properties:
        operation:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/DeviceOperationSummary"
        readiness:
          $ref: "#/components/schemas/DeviceReadinessProjection"
        video_metadata:
          type: object
          additionalProperties: true
    DeviceReadinessProjection:
      type: object
      required: [state, product_state, sources]
      properties:
        state:
          $ref: "#/components/schemas/DeviceReadinessState"
        product_state:
          $ref: "#/components/schemas/ProductReadinessState"
        sources:
          type: object
          required: [device_enabled, device_status]
          properties:
            device_enabled:
              type: boolean
            device_status:
              $ref: "#/components/schemas/DeviceStatus"
            provisioning_operation_status:
              nullable: true
              $ref: "#/components/schemas/DeviceOperationStatus"
            video_cloud_activation_status:
              $ref: "#/components/schemas/VideoCloudActivationStatus"
            deactivation_operation_status:
              $ref: "#/components/schemas/DeviceOperationStatus"
            video_cloud_last_error:
              type: object
              nullable: true
              additionalProperties: true
    User:
      type: object
      required: [id, email, email_verified, signup_pending_verification, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        email_verified:
          type: boolean
        email_verified_at:
          type: string
          format: date-time
        signup_pending_verification:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
    Organization:
      type: object
      required: [id, name, tier, evaluation_device_quota, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        tier:
          $ref: "#/components/schemas/OrganizationTier"
        evaluation_device_quota:
          type: integer
          minimum: 1
          maximum: 200
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrganizationTier:
      type: string
      enum: [evaluation, commercial]
    Member:
      type: object
      required: [organization_id, user_id, email, role, created_at, updated_at]
      properties:
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
    Device:
      type: object
      required: [id, organization_id, name, category, status, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: "#/components/schemas/DeviceCategory"
        serial_number:
          type: string
        mac_address:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        status:
          $ref: "#/components/schemas/DeviceStatus"
        last_seen_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
    DeviceGroup:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        device_count:
          type: integer
          minimum: 0
    DeviceTag:
      type: object
      required: [organization_id, device_id, tag, created_at, updated_at]
      properties:
        organization_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        tag:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    QuotaRaiseRequest:
      type: object
      required: [id, organization_id, requested_by, requested_quota, use_case, contact_info, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid
        requested_quota:
          type: integer
          minimum: 1
          maximum: 200
        use_case:
          type: string
        contact_info:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/QuotaRaiseRequestStatus"
        decided_by:
          type: string
          format: uuid
        decision_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
    QuotaRaiseRequestStatus:
      type: string
      enum: [pending, approved, declined]
    DeviceOperationSummary:
      type: object
      required: [operation_id, correlation_id, message_id, device_id, operation_type, status, created_at, updated_at]
      properties:
        operation_id:
          type: string
        correlation_id:
          type: string
        message_id:
