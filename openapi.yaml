  /v1/developer/brand-clouds/{brandCloudId}/pki/test-app-certificates:
    post:
      tags: [Developer Brand Clouds]
      operationId: issueDeveloperPKITestAppCertificate
      x-rtk-feature-id: FEAT-CA-BFF-001
      x-rtk-requirement-ids:
        - REQ-CA-BFF-PKI-TEST-001
      summary: Issue a fixed 30-day certificate-only test bundle for a scoped app identity.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_type, target_id, csr_pem]
              properties:
                target_type: { type: string, enum: [user, end_user] }
                target_id: { type: string }
                csr_pem: { type: string }
      responses:
        "201":
          description: Certificate issued. The private key remains caller-managed.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppCertificateBootstrap" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable client key used to safely replay a mutation.
      schema:
        type: string
        minLength: 1
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BrandCloudId:
      name: brandCloudId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChipsetId:
      name: chipsetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OIDCProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^[A-Za-z0-9_-]+$"
    IdentityId:
      name: identityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Tag:
      name: tag
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalid_claim_token:
              summary: Non-retryable Claim Token error.
              value:
                error:
                  code: invalid_claim_token
                  message: Invalid claim token
                  retryable: false
                  resolution_action: scan_or_enter_a_valid_claim_token
            claim_service_unavailable:
              summary: Retryable Claim Token service error.
              value:
                error:
                  code: service_unavailable
                  message: Claim resolve is temporarily unavailable
                  retryable: true
                  resolution_action: retry_later
            oidc_user_not_provisioned:
              summary: Unknown SSO user.
              value:
                error:
                  code: user_not_provisioned
                  message: SSO user is not provisioned in account manager
            oidc_disabled:
              summary: OIDC login disabled.
              value:
                error:
                  code: oidc_disabled
                  message: OIDC authentication is disabled
            invalid_oidc_state:
              summary: Invalid or replayed OIDC state.
              value:
                error:
                  code: invalid_oidc_state
                  message: Invalid OIDC login state
            invalid_oidc_token:
              summary: Invalid OIDC token.
              value:
                error:
                  code: invalid_oidc_token
                  message: Invalid OIDC token
            unverified_oidc_email:
              summary: Unverified OIDC email.
              value:
                error:
                  code: unverified_oidc_email
                  message: OIDC email is not verified
            oidc_provider_misconfigured:
              summary: OIDC provider misconfigured.
              value:
                error:
                  code: oidc_provider_misconfigured
                  message: OIDC provider is misconfigured
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    RegisterRequest:
      allOf:
        - $ref: "#/components/schemas/SignupRequest"
    SignupRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
      additionalProperties: false
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    AuthTokenRequest:
      type: object
      required: [token]
