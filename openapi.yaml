openapi: 3.0.3
x-rtk-spec:
  id: SPEC-AM-OPENAPI
  status: normative
  owner: rtk_account_manager
info:
  title: RTK Account Manager API
  version: 0.1.0
  description: |
    RTK Account Manager is a backend service API and authoritative account-side
    control plane for identity, tenant context, authorization, device registry,
    and provisioning intent.

    This service does not provide a WebUI, dashboard, frontend console, BFF
    session layer, UI preferences, or display-cache ownership. WebUI and
    dashboard experiences belong to client or console repositories such as
    `rtk_cloud_admin`; those clients consume this OpenAPI contract instead of
    being implemented in this server.
tags:
  - name: System
    description: Health and service-level probes.
  - name: Auth
    description: Email/password authentication, signup, token refresh, and logout.
  - name: OIDC
    description: OpenID Connect discovery and login callback flow.
  - name: Current User
    description: Current-user profile, password, and linked identity management.
  - name: Organizations
    description: Organization creation, listing, retrieval, and profile updates.
  - name: Members
    description: Organization membership and member lifecycle management.
  - name: Devices
    description: Account-side device registry operations.
  - name: Device Tags
    description: Device tag assignment and removal.
  - name: Device Groups
    description: Device group management and assignment.
  - name: Device Claims
    description: Claim token resolution and ownership transfer.
  - name: Device Claim Tokens
    description: Platform-admin claim token lifecycle operations.
  - name: Provisioning
    description: Provision, deactivation, unprovision, and readiness operations.
  - name: Quota
    description: Evaluation quota raise request workflows.
  - name: Admin Metrics
    description: Platform-admin operational metrics.
  - name: Brand Clouds
    description: Platform-admin brand cloud and scoped user management.
  - name: Developer Brand Clouds
    description: Developer-owned brand cloud listing, creation, and owner transfer.
  - name: Brand Cloud Auth
    description: Brand-cloud scoped authentication and current account endpoints.
  - name: App End Users
    description: APP-only global end-user authentication and device claim binding.
  - name: Identity Providers
    description: Platform-admin OIDC provider configuration.
  - name: ACL
    description: Platform-admin role, permission, assignment, mapping, and ACL audit operations.
  - name: Audit
    description: Platform-admin audit event listing.
  - name: ChipSet SDK Providers
    description: Platform-published external ChipSet and SDK information manifests.
  - name: Billing and Payments
    description: Organization-scoped commercial balance, payment methods, intents, and automatic top-up.
  - name: Payment Webhooks
    description: Provider-authenticated payment callback ingestion.
  - name: Internal Billing
    description: Dedicated service-authenticated commercial debit ingestion.
servers:
  - url: http://localhost:8080
paths:
  /v1/health:
    get:
      tags:
        - System
      operationId: getHealth
      x-rtk-feature-id: FEAT-CA-OBS-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-DASH-001
      summary: Check service health.
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/register:
    post:
      tags:
        - Auth
      operationId: registerUser
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Register a user and initial organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/signup:
    post:
      tags:
        - Auth
      operationId: signupUser
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Create a developer account and default brand cloud.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Developer signup accepted and verification token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      tags:
        - Auth
      operationId: loginUser
      x-rtk-feature-id: FEAT-AM-IDENTITY-001
      x-rtk-requirement-ids:
        - REQ-AM-PASSWORD-SESSION-001
      summary: Login with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/sign-in:
    post:
      tags:
        - Auth
      operationId: requestEmailSignIn
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-AM-EMAIL-DELIVERY-001
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Request an email sign-in activation token.
      description: Returns the same `202 Accepted` status for unknown, disabled, pending, and throttled users to avoid account enumeration. Raw tokens are delivered only by the configured server-side AuthTokenSink and are never returned in the HTTP response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Sign-in request accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/login/activate:
    post:
      tags:
        - Auth
      operationId: activateEmailSignIn
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-AM-EMAIL-DELIVERY-001
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Activate an email sign-in token.
      description: Consumes a one-time `login_activation` token and issues the normal Account Manager access and refresh token response. Invalid, expired, and replayed tokens fail without issuing a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: Login activation succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      x-rtk-feature-id: FEAT-AM-IDENTITY-001
      x-rtk-requirement-ids:
        - REQ-AM-PASSWORD-SESSION-001
      summary: Exchange a refresh token for new tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/verify-email:
    post:
      tags:
        - Auth
      operationId: verifyEmail
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Verify a user's email with an OTP token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: Email verified and initial tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/resend-verification:
    post:
      tags:
        - Auth
      operationId: resendEmailVerification
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Issue a replacement email verification token.
      description: Returns the same status for unknown, already verified, disabled, or throttled users to avoid account enumeration. Token delivery is owned by the configured server-side AuthTokenSink adapter, not by the HTTP response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Verification resend accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/forgot-password:
    post:
      tags:
        - Auth
      operationId: requestPasswordReset
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Issue a self-service password reset token.
      description: Returns the same status for unknown, disabled, or throttled users to avoid account enumeration. Token delivery is owned by the configured server-side AuthTokenSink adapter, not by the HTTP response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Password reset request accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/reset-password:
    post:
      tags:
        - Auth
      operationId: resetPassword
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Reset a user's password with a reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset and active refresh tokens revoked.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/oidc/providers:
    get:
      tags:
        - OIDC
      operationId: listOIDCProviders
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ACCESS-003
      summary: List enabled public OIDC providers.
      description: Returns public provider metadata only. Client secrets and secret references are never exposed by this endpoint.
      responses:
        "200":
          description: OIDC provider discovery result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCProvidersResponse"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/oidc/{providerId}/login:
    get:
      tags:
        - OIDC
      operationId: startOIDCLogin
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ACCESS-003
      summary: Start an OIDC authorization-code login.
      description: Creates a short-lived hashed state/nonce record and redirects the browser to the provider authorization endpoint.
      parameters:
        - $ref: "#/components/parameters/OIDCProviderId"
      responses:
        "302":
          description: Redirect to OIDC provider authorization endpoint.
          headers:
            Location:
              description: Provider authorization URL.
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/oidc/{providerId}/callback:
    get:
      tags:
        - OIDC
      operationId: handleOIDCCallback
      x-rtk-feature-id: FEAT-CA-AUTHZ-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-ACCESS-003
      summary: Handle OIDC authorization-code callback.
      description: Validates state, nonce, issuer, audience, signature, expiry, and verified email before returning the normal account-manager token response shape.
      parameters:
        - $ref: "#/components/parameters/OIDCProviderId"
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OIDC login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/login:
    post:
      tags:
        - Brand Cloud Auth
      operationId: loginBrandCloudUser
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Login to one brand cloud namespace with email and password.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Brand-cloud login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudLoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/sign-in:
    post:
      tags:
        - Brand Cloud Auth
      operationId: requestBrandCloudEmailSignIn
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Request a tenant-scoped brand-cloud email sign-in activation token.
      description: Returns the same `202 Accepted` status for unknown, disabled, pending, tenant-mismatched, and throttled users to avoid account enumeration. Raw tokens are delivered only by the configured server-side AuthTokenSink.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Brand-cloud sign-in request accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/login/activate:
    post:
      tags:
        - Brand Cloud Auth
      operationId: activateBrandCloudEmailSignIn
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Activate a tenant-scoped brand-cloud email sign-in token.
      description: Consumes a one-time `login_activation` token only when the token's user is active in the requested brand-cloud tenant and issues brand-cloud scoped tokens.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: Brand-cloud login activation succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudLoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/activate:
    post:
      tags:
        - Brand Cloud Auth
      operationId: activateBrandCloudUser
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Set a password and activate a pending brand-cloud user.
      description: Consumes a tenant-scoped one-time `brand_cloud_user_activation` token, verifies the email, clears pending status, and issues a tenant-scoped session. Replay, expiry, and tenant mismatch are rejected.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCloudUserActivationRequest"
      responses:
        "200":
          description: Brand-cloud user activation succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudLoginResponse"
        "400":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/refresh:
    post:
      tags:
        - Brand Cloud Auth
      operationId: refreshBrandCloudToken
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      summary: Exchange a brand-cloud refresh token for new brand-cloud tokens.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Brand-cloud token refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/logout:
    post:
      tags:
        - Brand Cloud Auth
      operationId: logoutBrandCloudUser
      x-rtk-feature-id: FEAT-AM-SIGNUP-001
      x-rtk-requirement-ids:
        - REQ-E2E-CA-SIGNUP-EMAIL-001
      security:
        - bearerAuth: []
      summary: Revoke one brand-cloud refresh token.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Brand-cloud refresh token revoked.
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/developer/brand-clouds:
    get:
      tags:
        - Developer Brand Clouds
      operationId: listDeveloperBrandClouds
      x-rtk-feature-id: FEAT-CA-BRAND-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-CLOUD-005
      security:
        - bearerAuth: []
      summary: List brand clouds visible to the current developer.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Developer brand cloud list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudsResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Developer Brand Clouds
      operationId: createDeveloperBrandCloud
      x-rtk-feature-id: FEAT-CA-BRAND-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-CLOUD-005
      security:
        - bearerAuth: []
      summary: Create a brand cloud owned by the current developer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCloudRequest"
      responses:
        "201":
          description: Developer brand cloud created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/developer/brand-clouds/{brandCloudId}:
    get:
      tags: [Developer Brand Clouds]
      operationId: getDeveloperBrandCloud
      x-rtk-feature-id: FEAT-CA-BRAND-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-CLOUD-005
      summary: Get a Brand Cloud and the current developer membership.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
      responses:
        "200":
          description: Developer Brand Cloud detail and current membership.
          content:
            application/json:
              schema:
                type: object
                required: [brand_cloud, membership]
                properties:
                  brand_cloud: { $ref: "#/components/schemas/Organization" }
                  membership: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/developer/brand-clouds/{brandCloudId}/members:
    get:
      tags: [Developer Brand Clouds]
      operationId: listDeveloperBrandCloudMembers
      x-rtk-feature-id: FEAT-CA-BRAND-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-CLOUD-005
      summary: List members of a developer Brand Cloud.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Developer Brand Cloud members.
          content:
            application/json:
              schema:
                type: object
                required: [members, pagination]
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/Member" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/developer/brand-clouds/{brandCloudId}/members/{userId}:
    patch:
      tags: [Developer Brand Clouds]
      operationId: updateDeveloperBrandCloudMember
      x-rtk-feature-id: FEAT-CA-BRAND-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-CLOUD-005
      summary: Update a Developer Brand Cloud member role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member] }
      responses:
        "200": { description: Member updated. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/developer/brand-clouds/{brandCloudId}/members/{userId}/disable:
    patch:
      tags: [Developer Brand Clouds]
      operationId: disableDeveloperBrandCloudMember
      x-rtk-feature-id: FEAT-CA-BRAND-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-CLOUD-005
      summary: Disable a member in this Brand Cloud without disabling the global account.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200": { description: Member disabled. }
        "409": { $ref: "#/components/responses/Error" }
  /v1/developer/brand-clouds/{brandCloudId}/members/{userId}/enable:
    patch:
      tags: [Developer Brand Clouds]
      operationId: enableDeveloperBrandCloudMember
      x-rtk-feature-id: FEAT-CA-BRAND-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-CLOUD-005
      summary: Re-enable a member in this Brand Cloud.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200": { description: Member enabled. }
    delete:
      tags: [Developer Brand Clouds]
      operationId: removeDeveloperBrandCloudMember
      x-rtk-feature-id: FEAT-CA-BRAND-001
      x-rtk-requirement-ids:
        - REQ-UI-CA-CLOUD-005
      summary: Remove a Developer Brand Cloud member.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Member removed. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/developer/brand-clouds/{brandCloudId}/members/invitations:
    post:
      tags: [Developer Brand Clouds]
