        "200":
          description: Payment intent page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntentsResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/orgs/{orgId}/payment-intents/{intentId}:
    get:
      tags: [Billing and Payments]
      operationId: getPaymentIntent
      x-rtk-feature-id: FEAT-AM-PAYMENT-001
      x-rtk-requirement-ids:
        - REQ-AM-PAYMENT-INTENT-001
        - REQ-AM-PAYMENT-AUTHZ-001
      security: [{ bearerAuth: [] }]
      summary: Read one customer-safe payment intent and its normalized attempts.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/PaymentIntentId"
      responses:
        "200":
          description: Intent detail without provider transaction references or evidence digests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntentDetailResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/internal/billing/debits:
    post:
      tags: [Internal Billing]
      operationId: postInternalBillingDebit
      x-rtk-feature-id: FEAT-AM-PAYMENT-001
      x-rtk-requirement-ids:
        - REQ-AM-BILLING-DEBIT-001
        - REQ-AM-BALANCE-LEDGER-001
      security: [{ serviceBearerAuth: [] }]
      summary: Post one authenticated idempotent invoice or usage-adjustment debit.
      description: Uses a dedicated billing-source credential. It does not calculate prices or invoices and cannot post credits, manual adjustments, refunds, or chargebacks.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalBillingDebitRequest" }
      responses:
        "201":
          description: Debit and balance projection committed atomically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalBillingDebitResponse" }
        "200":
          description: Semantically identical idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalBillingDebitResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/payment-webhooks/{provider}:
    post:
      tags: [Payment Webhooks]
      operationId: ingestPaymentWebhook
      x-rtk-feature-id: FEAT-AM-PAYMENT-001
      x-rtk-requirement-ids:
        - REQ-AM-PAYMENT-WEBHOOK-001
      summary: Verify, deduplicate, and enqueue a payment provider callback.
      parameters:
        - $ref: "#/components/parameters/PaymentProvider"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: string, format: binary }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Verified callback accepted or replay deduplicated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentWebhookResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable client key used to safely replay a mutation.
      schema:
        type: string
        minLength: 1
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BrandCloudId:
      name: brandCloudId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BrandCloudUserId:
      name: brandCloudUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChipsetId:
      name: chipsetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OIDCProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^[A-Za-z0-9_-]+$"
    IdentityId:
      name: identityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Tag:
      name: tag
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    PaymentMethodId:
      name: methodId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentIntentId:
      name: intentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_]{1,32}$"
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted or unquoted numeric automatic top-up policy version; use 0 to create the first policy.
      schema:
        type: string
        pattern: '^"?[0-9]+"?$'
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalid_claim_token:
              summary: Non-retryable Claim Token error.
              value:
                error:
                  code: invalid_claim_token
                  message: Invalid claim token
                  retryable: false
                  resolution_action: scan_or_enter_a_valid_claim_token
            claim_service_unavailable:
              summary: Retryable Claim Token service error.
              value:
                error:
                  code: service_unavailable
                  message: Claim resolve is temporarily unavailable
                  retryable: true
                  resolution_action: retry_later
            oidc_user_not_provisioned:
              summary: Unknown SSO user.
              value:
                error:
                  code: user_not_provisioned
                  message: SSO user is not provisioned in account manager
            oidc_disabled:
              summary: OIDC login disabled.
              value:
                error:
                  code: oidc_disabled
                  message: OIDC authentication is disabled
            invalid_oidc_state:
              summary: Invalid or replayed OIDC state.
              value:
                error:
                  code: invalid_oidc_state
                  message: Invalid OIDC login state
            invalid_oidc_token:
              summary: Invalid OIDC token.
              value:
                error:
                  code: invalid_oidc_token
                  message: Invalid OIDC token
            unverified_oidc_email:
              summary: Unverified OIDC email.
              value:
                error:
                  code: unverified_oidc_email
                  message: OIDC email is not verified
            oidc_provider_misconfigured:
              summary: OIDC provider misconfigured.
              value:
                error:
                  code: oidc_provider_misconfigured
                  message: OIDC provider is misconfigured
  schemas:
    Currency:
      type: string
      enum: [TWD]
    MoneyMinor:
      type: integer
      format: int64
      multipleOf: 100
    InternalBillingDebitRequest:
      type: object
      additionalProperties: false
      required: [organization_id, amount_minor, currency, reason, external_id]
      properties:
        organization_id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyMinor" }
        currency: { $ref: "#/components/schemas/Currency" }
        reason: { type: string, enum: [invoice_debit, usage_adjustment_debit] }
        external_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Immutable invoice or usage-adjustment reference owned by the authenticated billing source.
    InternalBillingDebitResponse:
      type: object
      required: [account_id, ledger_entry_id, balance_after_minor, currency, duplicate]
      properties:
        account_id: { type: string, format: uuid }
        ledger_entry_id: { type: string, format: uuid }
        balance_after_minor: { type: integer, format: int64 }
        currency: { $ref: "#/components/schemas/Currency" }
        duplicate: { type: boolean }
        payment_intent_id:
          type: string
          format: uuid
          nullable: true
    CommercialAccount:
      type: object
      required: [id, organization_id, currency, available_balance_minor, state, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        currency: { $ref: "#/components/schemas/Currency" }
        available_balance_minor: { type: integer, format: int64 }
        state:
          type: string
          enum: [active, attention_required, suspended, closed]
        version: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BillingAccountResponse:
      type: object
      required: [account, auto_topup]
      properties:
        account: { $ref: "#/components/schemas/CommercialAccount" }
        auto_topup:
          allOf: [{ $ref: "#/components/schemas/AutoTopUpPolicy" }]
          nullable: true
    BillingLedgerEntry:
      type: object
      required: [id, direction, amount_minor, currency, reason, balance_after_minor, created_at]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [credit, debit] }
        amount_minor: { $ref: "#/components/schemas/MoneyMinor" }
        currency: { $ref: "#/components/schemas/Currency" }
        reason:
          type: string
          enum: [invoice_debit, usage_adjustment_debit, manual_adjustment_debit, payment_top_up_credit, manual_adjustment_credit, refund_debit, chargeback_debit]
        balance_after_minor: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    BillingLedgerResponse:
      type: object
      required: [ledger_entries, pagination]
      properties:
        ledger_entries:
          type: array
          items: { $ref: "#/components/schemas/BillingLedgerEntry" }
        pagination: { $ref: "#/components/schemas/Pagination" }
    PaymentProviderCapabilities:
      type: object
      required: [hosted_setup, vaulted_method, merchant_initiated_charge, status_query, webhook, refund, requires_customer_action]
      properties:
        hosted_setup: { type: boolean }
        vaulted_method: { type: boolean }
        merchant_initiated_charge: { type: boolean }
        status_query: { type: boolean }
        webhook: { type: boolean }
        refund: { type: boolean }
        requires_customer_action: { type: boolean }
    PaymentMethod:
      type: object
      description: Customer-safe display metadata. Provider customer/method references and card credentials are never returned.
      required: [id, account_id, provider, status, capabilities, consent_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        provider: { type: string }
        status: { type: string, enum: [pending, active, expired, revoked, failed] }
        card_brand: { type: string }
        last_four: { type: string, pattern: "^[0-9]{4}$" }
        expiry_month: { type: integer, minimum: 1, maximum: 12 }
        expiry_year: { type: integer, minimum: 2000, maximum: 9999 }
        capabilities: { $ref: "#/components/schemas/PaymentProviderCapabilities" }
        consent_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaymentMethodsResponse:
      type: object
      required: [payment_methods, pagination]
      properties:
        payment_methods:
          type: array
          items: { $ref: "#/components/schemas/PaymentMethod" }
        pagination: { $ref: "#/components/schemas/Pagination" }
    PaymentMethodSetupRequest:
      type: object
      additionalProperties: false
      required: [provider, consent]
      properties:
        provider:
          type: string
          pattern: "^[a-z0-9_]{1,32}$"
        consent: { $ref: "#/components/schemas/PaymentConsentAcceptance" }
      description: Card number, CVV/CVC, expiry, and magnetic-stripe data are forbidden.
    PaymentMethodSetupResponse:
      type: object
      required: [payment_method, hosted_url, duplicate]
      properties:
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
        hosted_url:
          type: string
          format: uri
          description: Short-lived provider-hosted URL; never logged or stored in audit payloads.
        duplicate: { type: boolean }
    PaymentMutationReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    RevokePaymentMethodResponse:
      type: object
      required: [payment_method, policy_disabled, duplicate]
      properties:
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
        policy_disabled: { type: boolean }
        duplicate: { type: boolean }
    AutoTopUpPolicy:
      type: object
      required: [id, enabled, threshold_minor, top_up_amount_minor, currency, payment_method_id, daily_attempt_limit, daily_amount_limit_minor, cooldown_seconds, generation, version, armed, limit_timezone, limit_reset_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        enabled: { type: boolean }
        threshold_minor: { $ref: "#/components/schemas/MoneyMinor" }
        top_up_amount_minor: { $ref: "#/components/schemas/MoneyMinor" }
        currency: { $ref: "#/components/schemas/Currency" }
        payment_method_id: { type: string, format: uuid }
        daily_attempt_limit: { type: integer, minimum: 1, maximum: 10 }
        daily_amount_limit_minor: { $ref: "#/components/schemas/MoneyMinor" }
        cooldown_seconds: { type: integer, format: int64, minimum: 300 }
        generation: { type: integer, format: int64, minimum: 1 }
        version: { type: integer, format: int64, minimum: 1 }
        armed: { type: boolean }
        last_triggered_at: { type: string, format: date-time, nullable: true }
        last_succeeded_at: { type: string, format: date-time, nullable: true }
        limit_timezone: { type: string, enum: [UTC] }
        limit_reset_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AutoTopUpResponse:
      type: object
      required: [auto_topup]
      properties:
        auto_topup:
          allOf: [{ $ref: "#/components/schemas/AutoTopUpPolicy" }]
          nullable: true
    PaymentConsentAcceptance:
      type: object
      additionalProperties: false
      required: [accepted, text_version, text_sha256, locale]
      properties:
        accepted: { type: boolean, enum: [true] }
        text_version: { type: string, minLength: 1, maxLength: 128 }
        text_sha256: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
        locale: { type: string, minLength: 2, maxLength: 35 }
    PutAutoTopUpRequest:
      type: object
      additionalProperties: false
      required: [enabled, threshold_minor, top_up_amount_minor, currency, payment_method_id, daily_attempt_limit, daily_amount_limit_minor, cooldown_seconds, consent]
      properties:
        enabled: { type: boolean }
        threshold_minor: { $ref: "#/components/schemas/MoneyMinor" }
        top_up_amount_minor: { $ref: "#/components/schemas/MoneyMinor" }
        currency: { $ref: "#/components/schemas/Currency" }
        payment_method_id: { type: string, format: uuid }
        daily_attempt_limit: { type: integer, minimum: 1, maximum: 10 }
        daily_amount_limit_minor: { $ref: "#/components/schemas/MoneyMinor" }
        cooldown_seconds: { type: integer, format: int64, minimum: 300 }
        consent: { $ref: "#/components/schemas/PaymentConsentAcceptance" }
    ManualTopUpRequest:
      type: object
      additionalProperties: false
      required: [amount_minor, currency, payment_method_id]
      properties:
        amount_minor: { $ref: "#/components/schemas/MoneyMinor" }
        currency: { $ref: "#/components/schemas/Currency" }
        payment_method_id: { type: string, format: uuid }
    PaymentIntent:
      type: object
      description: Customer-safe normalized intent; provider order and transaction references are intentionally absent.
      required: [id, amount_minor, currency, reason, provider, payment_method_id, state, requires_customer_action, correlation_id, created_at, updated_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        amount_minor: { $ref: "#/components/schemas/MoneyMinor" }
        currency: { $ref: "#/components/schemas/Currency" }
        reason: { type: string, enum: [manual_top_up, auto_top_up] }
        provider: { type: string }
        payment_method_id: { type: string, format: uuid }
        state: { type: string, enum: [created, processing, authorized, requires_action, unknown, succeeded, failed, canceled] }
        requires_customer_action: { type: boolean }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    ManualTopUpResponse:
      type: object
      required: [payment_intent, duplicate]
      properties:
        payment_intent: { $ref: "#/components/schemas/PaymentIntent" }
        duplicate: { type: boolean }
    PaymentIntentsResponse:
      type: object
      required: [payment_intents, pagination]
      properties:
        payment_intents:
          type: array
          items: { $ref: "#/components/schemas/PaymentIntent" }
        pagination: { $ref: "#/components/schemas/Pagination" }
    PaymentAttempt:
      type: object
      required: [id, operation, attempt_number, started_at, completed_at, status, provider_code, next_reconciliation_at]
      properties:
        id: { type: string, format: uuid }
        operation: { type: string, enum: [setup, charge, query, cancel, refund] }
        attempt_number: { type: integer, minimum: 1 }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [started, authorized, requires_action, unknown, succeeded, failed, canceled] }
        provider_code: { type: string }
        next_reconciliation_at: { type: string, format: date-time, nullable: true }
    PaymentIntentDetailResponse:
      type: object
      required: [payment_intent, attempts]
      properties:
        payment_intent: { $ref: "#/components/schemas/PaymentIntent" }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/PaymentAttempt" }
    PaymentWebhookResponse:
      type: object
      required: [accepted, duplicate]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    RegisterRequest:
      type: object
      required: [email, password, organization_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        app_csr_pem:
          type: string
          description: Optional app-generated CSR PEM for first-login app certificate bootstrap. The CSR private key stays on the app.
          minLength: 8
        display_name:
          type: string
        organization_name:
          type: string
          minLength: 1
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
        organization_name:
          type: string
          minLength: 1
          description: Optional initial Brand Cloud name. Blank or omitted values fall back to the normalized developer email.
        captcha_token:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    AuthTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 8
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: Current password for the authenticated user.
        new_password:
          type: string
          minLength: 8
    OIDCProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OIDCProviderPublic"
    OIDCProviderPublic:
      type: object
      required: [provider_id, name, type, issuer_url, scopes, enabled]
      properties:
        provider_id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/IdentityProviderType"
        issuer_url:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    UserIdentity:
      type: object
      required: [id, provider_id, provider_key, issuer_url, subject, email, email_verified, linked_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
          description: Internal identity provider row id.
        provider_key:
          type: string
          description: Stable public provider identifier, for example `keycloak`.
        issuer_url:
          type: string
          format: uri
        subject:
          type: string
          description: OIDC `sub` claim.
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        linked_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ACLPermission:
      type: object
      required: [id, name, domain, action, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        action:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ACLPermissionsResponse:
      type: object
      required: [permissions, pagination]
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/ACLPermission"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ACLRole:
      type: object
      required: [id, name, scope_type, system_role, created_at, updated_at]
      properties:
        id:
          type: string
