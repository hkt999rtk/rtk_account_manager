      type: object
      description: >
        Existing-device Realtek video provisioning request. This schema does not
        accept standalone `claim_material`, SDK-normalized `qr_payload`,
        serial number, activation code, MAC address, or factory identity fields;
        those claim/bind flows require a future dedicated endpoint or owner
        service. `video_cloud_devid` is the video-cloud device identity used for
        downstream subject-bound credential and transport flows; the
        account-manager registry category is not a credential scope.
      required: [video_cloud_devid, activity_id, clip_public_key]
      additionalProperties: false
      properties:
        video_cloud_devid:
          type: string
          minLength: 1
          description: Normalized Realtek video device identity to bind to the account-manager registry device. Video-side credentials are scoped to this identity, not to the registry category.
        activity_id:
          type: string
          minLength: 1
          description: Video-side activation activity identifier supplied by the onboarding flow.
        clip_public_key:
          type: string
          minLength: 1
          description: Public key material forwarded to the video-side lifecycle worker for activation.
        service_options:
          $ref: "#/components/schemas/NonEmptyServiceOptions"
        operation_id:
          type: string
          description: Optional client idempotency key; reuse with different claim material returns 409 Conflict.
    ClaimResolveRequest:
      type: object
      required: [claim_token, device_name]
      additionalProperties: false
      properties:
        claim_token:
          type: string
          minLength: 1
          description: Raw Claim Token scanned from onboarding material. The server hashes this value before lookup.
        device_name:
          type: string
          minLength: 1
          description: Registry device name to use when the claim creates a new device.
    ClaimProvisionInput:
      type: object
      required: [video_cloud_devid, activity_id, clip_public_key, service_options]
      properties:
