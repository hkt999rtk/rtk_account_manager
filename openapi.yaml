          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/device-groups/{groupId}/devices:
    get:
      tags:
        - Device Groups
      operationId: listDeviceGroupDevices
      security:
        - bearerAuth: []
      summary: List devices assigned to a group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Group device list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/device-groups/{groupId}/devices/{deviceId}:
    put:
      tags:
        - Device Groups
      operationId: addDeviceToGroup
      security:
        - bearerAuth: []
      summary: Add device to group.
      description: Repeating the same assignment is idempotent. Disabled registry devices may remain selectable.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device assigned to group.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Device Groups
      operationId: removeDeviceFromGroup
      security:
        - bearerAuth: []
      summary: Remove device from group.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device removed from group.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices:
    get:
      tags:
        - Devices
      operationId: listDevices
      security:
        - bearerAuth: []
      summary: List organization devices.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Device list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Devices
      operationId: createDevice
      security:
        - bearerAuth: []
      summary: Create device.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRequest"
      responses:
        "201":
          description: Device created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/claim/resolve:
    post:
      tags:
        - Device Claims
      operationId: resolveDeviceClaim
      security:
        - bearerAuth: []
      summary: Resolve a device Claim Token.
      description: >
        Resolves an account-manager-owned Claim Token into an
        organization-owned registry device and returns the normalized video
        provisioning input. This endpoint does not create a provisioning
        operation, publish outbox messages, or call the Realtek video service.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimResolveRequest"
            examples:
              claim_token:
                value:
                  claim_token: claim-token-from-qr
                  device_name: Front Door Camera
      responses:
        "201":
          description: Claim Token resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResolveResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}:
    get:
      tags:
        - Devices
      operationId: getDevice
      security:
        - bearerAuth: []
      summary: Get device details.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Devices
      operationId: updateDevice
      security:
        - bearerAuth: []
      summary: Update device.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRequest"
      responses:
        "200":
          description: Device updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Devices
      operationId: deleteDevice
      security:
        - bearerAuth: []
      summary: Delete device.
      description: Soft-disable the account-manager registry device record only. This route does not start product-level video deactivation.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device soft-disabled.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/tags:
    get:
      tags:
        - Device Tags
      operationId: listDeviceTags
      security:
        - bearerAuth: []
      summary: List device tags.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Device tag list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTagsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/tags/{tag}:
    put:
      tags:
        - Device Tags
      operationId: addDeviceTag
      security:
        - bearerAuth: []
      summary: Add device tag.
      description: Repeating the same tag assignment is idempotent.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Tag"
      responses:
        "200":
          description: Device tag assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTagResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Device Tags
      operationId: deleteDeviceTag
      security:
        - bearerAuth: []
      summary: Remove device tag.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Tag"
      responses:
        "204":
          description: Device tag removed.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/provision:
    post:
      tags:
        - Provisioning
      operationId: provisionDevice
      security:
        - bearerAuth: []
      summary: Create or reuse a provisioning operation.
      description: >
        Starts account-side claim/bind provisioning for an existing enabled
        organization-owned registry device. Account-manager device categories
        are registry taxonomy values, not Realtek video credential scopes; any
        category may use this flow when it has a valid `video_cloud_devid`
        mapping and lifecycle input. The current API accepts normalized Realtek
        video lifecycle material only; raw QR, serial-number, activation-code,
        transfer, and factory-reset reclaim flows are out of scope. Registry
        ownership remains scoped to the addressed organization and
        account-manager device id. Account manager does not issue video-cloud
        device tokens or certificates.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionDeviceRequest"
      responses:
        "200":
          description: Existing provisioning operation returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "201":
          description: Provisioning operation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/provisioning:
    get:
      tags:
        - Provisioning
      operationId: getProvisioningState
      security:
        - bearerAuth: []
      summary: Get latest provisioning state, account-side readiness, and projected video metadata.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Provisioning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningStateResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/deactivate:
    post:
      tags:
        - Provisioning
      operationId: deactivateDevice
      security:
        - bearerAuth: []
      summary: Create or reuse a deactivation operation.
      description: Start product-level video teardown by enqueuing `DeviceDeactivateRequested`. This route is distinct from registry soft-delete.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateDeviceRequest"
      responses:
        "200":
          description: Existing deactivation operation returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "201":
          description: Deactivation operation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/unprovision:
    post:
      tags:
        - Provisioning
      operationId: unprovisionDevice
      security:
        - bearerAuth: []
      summary: Unprovision a normal device for resale or re-onboarding.
      description: >
        Releases the current account-manager user/org binding for a normal
        device so a later owner can onboard it through fresh possession proof.
        This route is distinct from product deactivation and registry
        soft-disable: it does not revoke the factory certificate, denylist the
        device, or change canonical `service_options`.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUnprovisionRequest"
      responses:
        "200":
          description: Device user/org binding released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceUnprovisionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/devices/{deviceId}/status:
    patch:
      tags:
        - Devices
      operationId: updateDeviceStatus
      security:
        - bearerAuth: []
      summary: Update device status.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceStatusRequest"
      responses:
        "200":
          description: Device status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BrandCloudId:
      name: brandCloudId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BrandCloudUserId:
      name: brandCloudUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OIDCProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^[A-Za-z0-9_-]+$"
    IdentityId:
      name: identityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Tag:
      name: tag
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalid_claim_token:
              summary: Non-retryable Claim Token error.
              value:
                error:
                  code: invalid_claim_token
                  message: Invalid claim token
                  retryable: false
                  resolution_action: scan_or_enter_a_valid_claim_token
            claim_service_unavailable:
              summary: Retryable Claim Token service error.
              value:
                error:
                  code: service_unavailable
                  message: Claim resolve is temporarily unavailable
                  retryable: true
                  resolution_action: retry_later
            oidc_user_not_provisioned:
              summary: Unknown SSO user.
              value:
                error:
                  code: user_not_provisioned
                  message: SSO user is not provisioned in account manager
            oidc_disabled:
              summary: OIDC login disabled.
              value:
                error:
                  code: oidc_disabled
                  message: OIDC authentication is disabled
            invalid_oidc_state:
              summary: Invalid or replayed OIDC state.
              value:
                error:
                  code: invalid_oidc_state
                  message: Invalid OIDC login state
            invalid_oidc_token:
              summary: Invalid OIDC token.
              value:
                error:
                  code: invalid_oidc_token
                  message: Invalid OIDC token
            unverified_oidc_email:
              summary: Unverified OIDC email.
              value:
                error:
                  code: unverified_oidc_email
                  message: OIDC email is not verified
            oidc_provider_misconfigured:
              summary: OIDC provider misconfigured.
              value:
                error:
                  code: oidc_provider_misconfigured
                  message: OIDC provider is misconfigured
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    RegisterRequest:
      type: object
      required: [email, password, organization_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        app_csr_pem:
          type: string
          description: Optional app-generated CSR PEM for first-login app certificate bootstrap. The CSR private key stays on the app.
          minLength: 8
        display_name:
          type: string
        organization_name:
          type: string
          minLength: 1
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
        organization_name:
          type: string
          minLength: 1
          deprecated: true
          description: Ignored by developer signup; the default brand cloud name is the developer email.
        captcha_token:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    AuthTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 8
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: Current password for the authenticated user.
        new_password:
          type: string
          minLength: 8
    OIDCProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OIDCProviderPublic"
    OIDCProviderPublic:
      type: object
      required: [provider_id, name, type, issuer_url, scopes, enabled]
      properties:
        provider_id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/IdentityProviderType"
        issuer_url:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    UserIdentity:
      type: object
      required: [id, provider_id, provider_key, issuer_url, subject, email, email_verified, linked_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
          description: Internal identity provider row id.
        provider_key:
          type: string
          description: Stable public provider identifier, for example `keycloak`.
        issuer_url:
          type: string
          format: uri
        subject:
          type: string
          description: OIDC `sub` claim.
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        linked_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ACLPermission:
      type: object
      required: [id, name, domain, action, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        action:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ACLPermissionsResponse:
      type: object
      required: [permissions, pagination]
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/ACLPermission"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ACLRole:
      type: object
      required: [id, name, scope_type, system_role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scope_type:
          type: string
          enum: [platform, organization]
        description:
          type: string
        system_role:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
    ACLRolesResponse:
      type: object
      required: [roles, pagination]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ACLRole"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ACLRoleResponse:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ACLRole"
    ACLRoleCreateRequest:
      type: object
      required: [name, scope_type]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        scope_type:
          type: string
          enum: [platform, organization]
        description:
          type: string
    ACLRoleUpdateRequest:
      type: object
