openapi: 3.0.3
info:
  title: RTK Account Manager API
  version: 0.1.0
  description: |
    RTK Account Manager is a backend service API and authoritative account-side
    control plane for identity, tenant context, authorization, device registry,
    and provisioning intent.

    This service does not provide a WebUI, dashboard, frontend console, BFF
    session layer, UI preferences, or display-cache ownership. WebUI and
    dashboard experiences belong to client or console repositories such as
    `rtk_cloud_admin`; those clients consume this OpenAPI contract instead of
    being implemented in this server.
tags:
  - name: System
    description: Health and service-level probes.
  - name: Auth
    description: Email/password authentication, signup, token refresh, and logout.
  - name: OIDC
    description: OpenID Connect discovery and login callback flow.
  - name: Current User
    description: Current-user profile, password, and linked identity management.
  - name: Organizations
    description: Organization creation, listing, retrieval, and profile updates.
  - name: Members
    description: Organization membership and member lifecycle management.
  - name: Devices
    description: Account-side device registry operations.
  - name: Device Tags
    description: Device tag assignment and removal.
  - name: Device Groups
    description: Device group management and assignment.
  - name: Device Claims
    description: Claim token resolution and ownership transfer.
  - name: Device Claim Tokens
    description: Platform-admin claim token lifecycle operations.
  - name: Provisioning
    description: Provision, deactivation, unprovision, and readiness operations.
  - name: Quota
    description: Evaluation quota raise request workflows.
  - name: Admin Metrics
    description: Platform-admin operational metrics.
  - name: Brand Clouds
    description: Platform-admin brand cloud and scoped user management.
  - name: Developer Brand Clouds
    description: Developer-owned brand cloud listing, creation, and owner transfer.
  - name: Brand Cloud Auth
    description: Brand-cloud scoped authentication and current account endpoints.
  - name: App End Users
    description: APP-only global end-user authentication and device claim binding.
  - name: Identity Providers
    description: Platform-admin OIDC provider configuration.
  - name: ACL
    description: Platform-admin role, permission, assignment, mapping, and ACL audit operations.
  - name: Audit
    description: Platform-admin audit event listing.
servers:
  - url: http://localhost:8080
paths:
  /v1/health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Check service health.
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/register:
    post:
      tags:
        - Auth
      operationId: registerUser
      summary: Register a user and initial organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/signup:
    post:
      tags:
        - Auth
      operationId: signupUser
      summary: Create a developer account and default brand cloud.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Developer signup accepted and verification token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      tags:
        - Auth
      operationId: loginUser
      summary: Login with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/sign-in:
    post:
      tags:
        - Auth
      operationId: requestEmailSignIn
      summary: Request an email sign-in activation token.
      description: Returns the same `202 Accepted` status for unknown, disabled, pending, and throttled users to avoid account enumeration. Raw tokens are delivered only by the configured server-side AuthTokenSink and are never returned in the HTTP response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Sign-in request accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/login/activate:
    post:
      tags:
        - Auth
      operationId: activateEmailSignIn
      summary: Activate an email sign-in token.
      description: Consumes a one-time `login_activation` token and issues the normal Account Manager access and refresh token response. Invalid, expired, and replayed tokens fail without issuing a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: Login activation succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: Exchange a refresh token for new tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/verify-email:
    post:
      tags:
        - Auth
      operationId: verifyEmail
      summary: Verify a user's email with an OTP token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/resend-verification:
    post:
      tags:
        - Auth
      operationId: resendEmailVerification
      summary: Issue a replacement email verification token.
      description: Returns the same status for unknown, already verified, disabled, or throttled users to avoid account enumeration. Token delivery is owned by the configured server-side AuthTokenSink adapter, not by the HTTP response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Verification resend accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/forgot-password:
    post:
      tags:
        - Auth
      operationId: requestPasswordReset
      summary: Issue a self-service password reset token.
      description: Returns the same status for unknown, disabled, or throttled users to avoid account enumeration. Token delivery is owned by the configured server-side AuthTokenSink adapter, not by the HTTP response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Password reset request accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/reset-password:
    post:
      tags:
        - Auth
      operationId: resetPassword
      summary: Reset a user's password with a reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset and active refresh tokens revoked.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/oidc/providers:
    get:
      tags:
        - OIDC
      operationId: listOIDCProviders
      summary: List enabled public OIDC providers.
      description: Returns public provider metadata only. Client secrets and secret references are never exposed by this endpoint.
      responses:
        "200":
          description: OIDC provider discovery result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCProvidersResponse"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/oidc/{providerId}/login:
    get:
      tags:
        - OIDC
      operationId: startOIDCLogin
      summary: Start an OIDC authorization-code login.
      description: Creates a short-lived hashed state/nonce record and redirects the browser to the provider authorization endpoint.
      parameters:
        - $ref: "#/components/parameters/OIDCProviderId"
      responses:
        "302":
          description: Redirect to OIDC provider authorization endpoint.
          headers:
            Location:
              description: Provider authorization URL.
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/oidc/{providerId}/callback:
    get:
      tags:
        - OIDC
      operationId: handleOIDCCallback
      summary: Handle OIDC authorization-code callback.
      description: Validates state, nonce, issuer, audience, signature, expiry, and verified email before returning the normal account-manager token response shape.
      parameters:
        - $ref: "#/components/parameters/OIDCProviderId"
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OIDC login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/login:
    post:
      tags:
        - Brand Cloud Auth
      operationId: loginBrandCloudUser
      summary: Login to one brand cloud namespace with email and password.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Brand-cloud login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudLoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/sign-in:
    post:
      tags:
        - Brand Cloud Auth
      operationId: requestBrandCloudEmailSignIn
      summary: Request a tenant-scoped brand-cloud email sign-in activation token.
      description: Returns the same `202 Accepted` status for unknown, disabled, pending, tenant-mismatched, and throttled users to avoid account enumeration. Raw tokens are delivered only by the configured server-side AuthTokenSink.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Brand-cloud sign-in request accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/login/activate:
    post:
      tags:
        - Brand Cloud Auth
      operationId: activateBrandCloudEmailSignIn
      summary: Activate a tenant-scoped brand-cloud email sign-in token.
      description: Consumes a one-time `login_activation` token only when the token's user is active in the requested brand-cloud tenant and issues brand-cloud scoped tokens.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: Brand-cloud login activation succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudLoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/refresh:
    post:
      tags:
        - Brand Cloud Auth
      operationId: refreshBrandCloudToken
      summary: Exchange a brand-cloud refresh token for new brand-cloud tokens.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Brand-cloud token refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/auth/logout:
    post:
      tags:
        - Brand Cloud Auth
      operationId: logoutBrandCloudUser
      security:
        - bearerAuth: []
      summary: Revoke one brand-cloud refresh token.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Brand-cloud refresh token revoked.
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/developer/brand-clouds:
    get:
      tags:
        - Developer Brand Clouds
      operationId: listDeveloperBrandClouds
      security:
        - bearerAuth: []
      summary: List brand clouds visible to the current developer.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Developer brand cloud list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudsResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Developer Brand Clouds
      operationId: createDeveloperBrandCloud
      security:
        - bearerAuth: []
      summary: Create a brand cloud owned by the current developer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCloudRequest"
      responses:
        "201":
          description: Developer brand cloud created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/developer/brand-clouds/{brandCloudId}/owner-transfer:
    post:
      tags:
        - Developer Brand Clouds
      operationId: requestBrandCloudOwnerTransfer
      security:
        - bearerAuth: []
      summary: Request transfer of brand cloud ownership to an existing developer.
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCloudOwnerTransferRequest"
      responses:
        "202":
          description: Owner transfer email issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudOwnerTransferResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/developer/brand-cloud-owner-transfers/accept:
    post:
      tags:
        - Developer Brand Clouds
      operationId: acceptBrandCloudOwnerTransfer
      security:
        - bearerAuth: []
      summary: Accept a pending brand cloud owner transfer as the target developer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCloudOwnerTransferAcceptRequest"
      responses:
        "200":
          description: Owner transfer accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudOwnerTransferResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/brand-clouds/{tenantSlug}/me:
    get:
      tags:
        - Brand Cloud Auth
      operationId: getBrandCloudMe
      security:
        - bearerAuth: []
      summary: Get the current brand-cloud account subject.
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: Current brand-cloud account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudMeResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/app/end-users/auth/login:
    post:
      tags:
        - App End Users
      operationId: loginAppEndUser
      summary: Login or create a global APP end-user subject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppEndUserLoginRequest"
      responses:
        "200":
          description: APP end-user login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppEndUserLoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/app/end-users/auth/refresh:
    post:
      tags:
        - App End Users
      operationId: refreshAppEndUserToken
      summary: Exchange an APP end-user refresh token for new APP end-user tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: APP end-user token refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/app/end-users/auth/logout:
    post:
      tags:
        - App End Users
      operationId: logoutAppEndUser
      security:
        - bearerAuth: []
      summary: Revoke one APP end-user refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: APP end-user refresh token revoked.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/app/end-users/me:
    get:
      tags:
        - App End Users
      operationId: getAppEndUserMe
      security:
        - bearerAuth: []
      summary: Get the current APP end-user subject.
      responses:
        "200":
          description: Current APP end-user account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppEndUserMeResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/app/devices/claim/resolve:
    post:
      tags:
        - App End Users
      operationId: resolveAppEndUserDeviceClaim
      security:
        - bearerAuth: []
      summary: Resolve a Claim Token from the APP and bind the device to the current end user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimResolveRequest"
      responses:
        "201":
          description: Claim resolved and end-user binding created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppEndUserClaimResolveResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logoutUser
      security:
        - bearerAuth: []
      summary: Revoke a refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      tags:
        - Current User
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      summary: Get current user and organization memberships.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Current User
      operationId: deleteCurrentUser
      security:
        - bearerAuth: []
      summary: Disable the current user account.
      description: Soft-disables the authenticated user, revokes active refresh tokens, and refuses to disable the user while they are the last active owner of any organization. This does not delete organizations, memberships, devices, or product-level device state.
      responses:
        "204":
          description: Current user disabled and active refresh tokens revoked.
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/me/password:
    patch:
      tags:
        - Current User
      operationId: changeCurrentUserPassword
      security:
        - bearerAuth: []
      summary: Change the current user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and active refresh tokens revoked.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me/identities:
    get:
      tags:
        - Current User
      operationId: listCurrentUserIdentities
      security:
        - bearerAuth: []
      summary: List current user's external identities.
      responses:
        "200":
          description: Current user's linked external identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserIdentitiesResponse"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me/identities/{identityId}:
    delete:
      tags:
        - Current User
      operationId: deleteCurrentUserIdentity
      security:
        - bearerAuth: []
      summary: Unlink a current-user external identity.
      parameters:
        - $ref: "#/components/parameters/IdentityId"
      responses:
        "204":
          description: External identity unlinked.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs:
    get:
      tags:
        - Organizations
      operationId: listOrganizations
      security:
        - bearerAuth: []
      summary: List current user's organizations.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Organization list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationsResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Organizations
      operationId: createOrganization
      security:
        - bearerAuth: []
      summary: Create an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}:
    get:
      tags:
        - Organizations
      operationId: getOrganization
      security:
        - bearerAuth: []
      summary: Get organization details.
      parameters:
