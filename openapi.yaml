openapi: 3.0.3
info:
  title: RTK Account Manager API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /v1/health:
    get:
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/register:
    post:
      summary: Register a user and initial organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/signup:
    post:
      summary: Create a public evaluation-tier account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Signup accepted and verification token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      summary: Login with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/refresh:
    post:
      summary: Exchange a refresh token for new tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/verify-email:
    post:
      summary: Verify a user's email with an OTP token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/resend-verification:
    post:
      summary: Issue a replacement email verification token.
      description: Returns the same status for unknown, already verified, disabled, or throttled users to avoid account enumeration. Token delivery is owned by the configured server-side AuthTokenSink adapter, not by the HTTP response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Verification resend accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/forgot-password:
    post:
      summary: Issue a self-service password reset token.
      description: Returns the same status for unknown, disabled, or throttled users to avoid account enumeration. Token delivery is owned by the configured server-side AuthTokenSink adapter, not by the HTTP response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Password reset request accepted when applicable.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/reset-password:
    post:
      summary: Reset a user's password with a reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset and active refresh tokens revoked.
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/oidc/providers:
    get:
      summary: List enabled public OIDC providers.
      description: Returns public provider metadata only. Client secrets and secret references are never exposed by this endpoint.
      responses:
        "200":
          description: OIDC provider discovery result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCProvidersResponse"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/oidc/{providerId}/login:
    get:
      summary: Start an OIDC authorization-code login.
      description: Creates a short-lived hashed state/nonce record and redirects the browser to the provider authorization endpoint.
      parameters:
        - $ref: "#/components/parameters/OIDCProviderId"
      responses:
        "302":
          description: Redirect to OIDC provider authorization endpoint.
          headers:
            Location:
              description: Provider authorization URL.
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/oidc/{providerId}/callback:
    get:
      summary: Handle OIDC authorization-code callback.
      description: Validates state, nonce, issuer, audience, signature, expiry, and verified email before returning the normal account-manager token response shape.
      parameters:
        - $ref: "#/components/parameters/OIDCProviderId"
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OIDC login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      security:
        - bearerAuth: []
      summary: Revoke a refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      security:
        - bearerAuth: []
      summary: Get current user and organization memberships.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Disable the current user account.
      description: Soft-disables the authenticated user, revokes active refresh tokens, and refuses to disable the user while they are the last active owner of any organization. This does not delete organizations, memberships, devices, or product-level device state.
      responses:
        "204":
          description: Current user disabled and active refresh tokens revoked.
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/me/password:
    patch:
      security:
        - bearerAuth: []
      summary: Change the current user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and active refresh tokens revoked.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me/identities:
    get:
      security:
        - bearerAuth: []
      summary: List current user's external identities.
      responses:
        "200":
          description: Current user's linked external identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserIdentitiesResponse"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me/identities/{identityId}:
    delete:
      security:
        - bearerAuth: []
      summary: Unlink a current-user external identity.
      parameters:
        - $ref: "#/components/parameters/IdentityId"
      responses:
        "204":
          description: External identity unlinked.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs:
    get:
      security:
        - bearerAuth: []
      summary: List current user's organizations.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Organization list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationsResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      summary: Create an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}:
    get:
      security:
        - bearerAuth: []
      summary: Get organization details.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Organization details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      security:
        - bearerAuth: []
      summary: Update organization details.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/orgs/{orgId}/quota-raise-requests:
    post:
      security:
        - bearerAuth: []
      summary: Request an evaluation quota increase.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaRaiseRequestRequest"
      responses:
        "201":
          description: Quota-raise request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaRaiseRequestResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/quota-raise-requests:
    get:
      security:
        - bearerAuth: []
      summary: List quota-raise requests.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/QuotaRaiseRequestStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Quota-raise request list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaRaiseRequestsResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/quota-raise-requests/{requestId}:
    get:
      security:
        - bearerAuth: []
      summary: Get a quota-raise request.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Quota-raise request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaRaiseRequestResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/quota-raise-requests/{requestId}/approve:
    post:
      security:
        - bearerAuth: []
      summary: Approve a pending quota-raise request.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaRaiseDecisionRequest"
      responses:
        "200":
          description: Quota-raise request approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaRaiseDecisionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/quota-raise-requests/{requestId}/decline:
    post:
      security:
        - bearerAuth: []
      summary: Decline a pending quota-raise request.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaRaiseDecisionRequest"
      responses:
        "200":
          description: Quota-raise request declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaRaiseDecisionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/metrics:
    get:
      security:
        - bearerAuth: []
      summary: Get evaluation-tier, quota, and lifecycle metrics.
      responses:
        "200":
          description: Platform-admin metrics snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalTierMetricsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/brand-clouds:
    post:
      security:
        - bearerAuth: []
      summary: Create a platform-managed brand cloud.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCloudRequest"
      responses:
        "201":
          description: Brand cloud created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    get:
      security:
        - bearerAuth: []
      summary: List platform-managed brand clouds.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Brand cloud list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/brand-clouds/{brandCloudId}:
    get:
      security:
        - bearerAuth: []
      summary: Get a platform-managed brand cloud.
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
      responses:
        "200":
          description: Brand cloud.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      security:
        - bearerAuth: []
      summary: Update a platform-managed brand cloud.
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCloudRequest"
      responses:
        "200":
          description: Brand cloud updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/brand-clouds/{brandCloudId}/members:
    post:
      security:
        - bearerAuth: []
      summary: Assign an existing user to a brand cloud.
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCloudMemberRequest"
      responses:
        "201":
          description: Brand cloud member assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/brand-clouds/{brandCloudId}/users:
    post:
      security:
        - bearerAuth: []
      summary: Create or activate a user and assign them to a brand cloud.
      parameters:
        - $ref: "#/components/parameters/BrandCloudId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCloudUserRequest"
      responses:
        "200":
          description: Existing brand cloud user activated or assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudUserResponse"
        "201":
          description: Brand cloud user created and assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCloudUserResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/audit-events:
    get:
      security:
        - bearerAuth: []
      summary: List audit events.
      parameters:
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: subject_type
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Audit event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/acl/permissions:
    get:
      security:
        - bearerAuth: []
      summary: List product authorization permissions.
      responses:
        "200":
          description: Permission catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACLPermissionsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/acl/roles:
    get:
      security:
        - bearerAuth: []
      summary: List product authorization roles.
      responses:
        "200":
          description: Product role catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACLRolesResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      security:
        - bearerAuth: []
      summary: Create a product authorization role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ACLRoleCreateRequest"
      responses:
        "201":
          description: Product role created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACLRoleResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/acl/roles/{roleName}:
    get:
      security:
        - bearerAuth: []
      summary: Show a product authorization role.
      parameters:
        - name: roleName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACLRoleResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      security:
        - bearerAuth: []
      summary: Update a product authorization role.
      parameters:
        - name: roleName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ACLRoleUpdateRequest"
      responses:
        "200":
          description: Product role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACLRoleResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      security:
        - bearerAuth: []
      summary: Disable a product authorization role.
      parameters:
        - name: roleName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Role disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/acl/roles/{roleName}/permissions/{permissionName}:
    post:
      security:
        - bearerAuth: []
      summary: Bind a permission to a product authorization role.
      parameters:
        - name: roleName
          in: path
          required: true
          schema:
            type: string
        - name: permissionName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Permission bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/acl/role-assignments:
    get:
      security:
        - bearerAuth: []
      summary: List product authorization role assignments.
      responses:
        "200":
          description: Role assignments.
          content:
            application/json:
