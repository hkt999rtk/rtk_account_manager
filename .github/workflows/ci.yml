name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, account-manager-ci]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rtk_account_manager
          POSTGRES_USER: rtk
          POSTGRES_PASSWORD: rtk_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rtk -d rtk_account_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://rtk:rtk_password@localhost:5432/rtk_account_manager?sslmode=disable
      TEST_DATABASE_URL: postgres://rtk:rtk_password@localhost:5432/rtk_account_manager?sslmode=disable
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      PORT: 8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests and generate report
        run: make test-report

      - name: Build packages
        run: go build ./...

      - name: Upload test report artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: |
            docs/TEST_REPORT.md
            reports/
