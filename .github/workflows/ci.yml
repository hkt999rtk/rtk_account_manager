name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, account-manager-cd]
    timeout-minutes: 20

    env:
      DATABASE_URL: postgres://rtk:rtk_password@localhost:5432/rtk_account_manager?sslmode=disable
      TEST_DATABASE_URL: postgres://rtk:rtk_password@localhost:5432/rtk_account_manager?sslmode=disable
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      PORT: 8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Prepare Linode CI runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          missing_packages=()
          if ! command -v make >/dev/null 2>&1; then
            missing_packages+=(make)
          fi
          if ! command -v psql >/dev/null 2>&1; then
            missing_packages+=(postgresql postgresql-client)
          fi
          if [ "${#missing_packages[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${missing_packages[@]}"
          fi
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'rtk') THEN
              CREATE ROLE rtk LOGIN PASSWORD 'rtk_password';
            ELSE
              ALTER ROLE rtk LOGIN PASSWORD 'rtk_password';
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE rtk_account_manager OWNER rtk'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'rtk_account_manager')\gexec
          ALTER DATABASE rtk_account_manager OWNER TO rtk;
          SQL
          PGPASSWORD=rtk_password psql \
            "postgres://rtk@localhost:5432/rtk_account_manager?sslmode=disable" \
            -v ON_ERROR_STOP=1 \
            -c 'SELECT 1'

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests and generate report
        run: |
          REPORT_FILE=.artifacts/report-candidates/docs/TEST_REPORT.md \
            REPORT_GENERATED_AT=ci-candidate \
            REPORT_CANONICAL=true \
            make test-report
          ./scripts/validate-report-candidate.sh \
            docs/TEST_REPORT.md \
            .artifacts/report-candidates/docs/TEST_REPORT.md

      - name: Check committed test report drift
        run: |
          if ! diff -u docs/TEST_REPORT.md .artifacts/report-candidates/docs/TEST_REPORT.md; then
            cat >&2 <<'MSG'
          docs/TEST_REPORT.md is stale.

          Import the generated test-report-candidate artifact into the PR branch
          with the "Import Report Candidate" workflow, or regenerate and commit the
          same candidate locally.
          MSG
            exit 1
          fi

      - name: Run repeatability smoke
        run: make test-repeat

      - name: Build packages
        run: go build ./...

      - name: Check release bundle
        run: VERSION="ci-${GITHUB_SHA::12}" make release

      - name: Check report candidate scripts
        run: make check-report-candidates

  deep-test:
    runs-on: [self-hosted, Linux, X64, account-manager-cd]
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Run race tests
        run: make test-race

      - name: Run fuzz smoke
        run: make fuzz-smoke
