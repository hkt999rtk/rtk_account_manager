name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rtk_account_manager
          POSTGRES_USER: rtk
          POSTGRES_PASSWORD: rtk_password
        ports:
          - 5432/tcp
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U rtk -d rtk_account_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GOWORK: "off"
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      PORT: 8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go for PR validation
        if: github.event_name == 'pull_request'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure job-local PostgreSQL endpoint
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          database_url="postgres://rtk:rtk_password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/rtk_account_manager?sslmode=disable"
          printf 'DATABASE_URL=%s\nTEST_DATABASE_URL=%s\n' "$database_url" "$database_url" >> "$GITHUB_ENV"
          fixture_id="$(docker inspect --format '{{.Image}}' "$POSTGRES_CONTAINER_ID")"
          printf 'REPORT_FIXTURE_ID=%s\n' "$fixture_id" >> "$GITHUB_ENV"

      - name: Test email signup IMAP helper
        run: make test-email-signup-helper

      - name: Check report candidate scripts
        run: make check-report-candidates

      - name: Run tests and generate report
        id: test_report
        run: |
          REPORT_FILE=.artifacts/report-candidates/docs/test_report.md \
            REPORT_GENERATED_AT=ci-candidate \
            REPORT_CANONICAL=true \
            make test-report
          ./scripts/validate-report-candidate.sh \
            docs/test_report.md \
            .artifacts/report-candidates/docs/test_report.md
          cp reports/execution-evidence.json .artifacts/report-candidates/execution-evidence.json

      - name: Check committed test report drift
        run: |
          if ! diff -u docs/test_report.md .artifacts/report-candidates/docs/test_report.md; then
            cat >&2 <<'MSG'
          docs/test_report.md is stale.

          Import the generated test-report-candidate artifact into the PR branch
          with the "Import Report Candidate" workflow, or regenerate and commit the
          same candidate locally.
          MSG
            exit 1
          fi

      - name: Upload validated test report candidate and provenance
        if: ${{ always() && steps.test_report.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: test-report-candidate
          path: .artifacts/report-candidates/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Run repeatability smoke
        run: make test-repeat

      - name: Check release bundle
        run: VERSION="ci-${GITHUB_SHA::12}" make release

  deep-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download dependencies
        run: go mod download

      - name: Run race tests
        run: make test-race

      - name: Run fuzz smoke
        run: make fuzz-smoke
