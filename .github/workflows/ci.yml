name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rtk_account_manager
          POSTGRES_USER: rtk
          POSTGRES_PASSWORD: rtk_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U rtk -d rtk_account_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      PORT: 8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure job-local PostgreSQL endpoint
        run: |
          database_url="postgres://rtk:rtk_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rtk_account_manager?sslmode=disable"
          printf 'DATABASE_URL=%s\nTEST_DATABASE_URL=%s\n' "$database_url" "$database_url" >> "$GITHUB_ENV"

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Test email signup IMAP helper
        run: make test-email-signup-helper

      - name: Run tests and generate report
        run: |
          REPORT_FILE=.artifacts/report-candidates/docs/TEST_REPORT.md \
            REPORT_GENERATED_AT=ci-candidate \
            REPORT_CANONICAL=true \
            make test-report
          ./scripts/validate-report-candidate.sh \
            docs/TEST_REPORT.md \
            .artifacts/report-candidates/docs/TEST_REPORT.md

      - name: Check committed test report drift
        run: |
          if ! diff -u docs/TEST_REPORT.md .artifacts/report-candidates/docs/TEST_REPORT.md; then
            cat >&2 <<'MSG'
          docs/TEST_REPORT.md is stale.

          Import the generated test-report-candidate artifact into the PR branch
          with the "Import Report Candidate" workflow, or regenerate and commit the
          same candidate locally.
          MSG
            exit 1
          fi

      - name: Run repeatability smoke
        run: make test-repeat

      - name: Build packages
        run: go build ./...

      - name: Check release bundle
        run: VERSION="ci-${GITHUB_SHA::12}" make release

      - name: Check report candidate scripts
        run: make check-report-candidates

  deep-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download dependencies
        run: go mod download

      - name: Run race tests
        run: make test-race

      - name: Run fuzz smoke
        run: make fuzz-smoke
