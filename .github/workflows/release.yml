name: Release Bundle

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Defaults to the git ref name or timestamped short SHA."
        required: false
        type: string
      publish_bundle:
        description: "Build and upload the native release bundle. Set false for GHCR image-only publishes."
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_bundle
    name: Package release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Select version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="ci-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::12}"
          fi
          case "$version" in
            *[!A-Za-z0-9._-]* | "" | .* | *..*)
              echo "invalid version: use only letters, digits, dot, underscore, and dash" >&2
              exit 1
              ;;
          esac
          artifact_name="rtk_account_manager"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Build release bundle
        run: VERSION="${{ steps.version.outputs.version }}" make release

      - name: Prepare Linode Object Storage release objects
        id: object
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_ASSET: dist/rtk_account_manager-${{ steps.version.outputs.version }}.tar.gz
          OUTPUT_DIR: dist
        run: |
          ./scripts/prepare-linode-release-objects.sh | tee .artifacts-release-objects.env
          while IFS= read -r line; do
            case "$line" in
              object_bundle=*|checksum_file=*|manifest_file=*|artifact_path=*|sha256=*)
                printf '%s\n' "$line" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < .artifacts-release-objects.env

      - name: Upload release objects to Linode Object Storage
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LINODE_OBJ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LINODE_OBJ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-sea
          AWS_EC2_METADATA_DISABLED: "true"
          LINODE_OBJ_BUCKET: ${{ vars.LINODE_OBJ_BUCKET }}
          LINODE_OBJ_ENDPOINT: ${{ vars.LINODE_OBJ_ENDPOINT }}
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
          OBJECT_BUNDLE: ${{ steps.object.outputs.object_bundle }}
          CHECKSUM_FILE: ${{ steps.object.outputs.checksum_file }}
          MANIFEST_FILE: ${{ steps.object.outputs.manifest_file }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$LINODE_OBJ_BUCKET"
          test -n "$LINODE_OBJ_ENDPOINT"
          prefix="releases/$ARTIFACT_NAME-$VERSION"
          go run ./cmd/linode-object-storage put --file "$OBJECT_BUNDLE" --key "$prefix/$VERSION.tar.gz"
          go run ./cmd/linode-object-storage put --file "$CHECKSUM_FILE" --key "$prefix/$VERSION.tar.gz.sha256"
          go run ./cmd/linode-object-storage put --file "$MANIFEST_FILE" --key "$prefix/manifest.json"

      - name: Generate release test report candidate
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_ASSET: dist/rtk_account_manager-${{ steps.version.outputs.version }}.tar.gz
          OBJECT_STORAGE_BUNDLE_KEY: releases/${{ steps.version.outputs.artifact_name }}-${{ steps.version.outputs.version }}/${{ steps.version.outputs.version }}.tar.gz
          OBJECT_STORAGE_CHECKSUM_KEY: releases/${{ steps.version.outputs.artifact_name }}-${{ steps.version.outputs.version }}/${{ steps.version.outputs.version }}.tar.gz.sha256
          OBJECT_STORAGE_MANIFEST_KEY: releases/${{ steps.version.outputs.artifact_name }}-${{ steps.version.outputs.version }}/manifest.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          contracts_commit="$(git ls-tree HEAD contracts 2>/dev/null | awk '{print $3}' || true)"
          OUTPUT=.artifacts/report-candidates/docs/RELEASE_TEST_REPORT.md \
            CONTRACTS_COMMIT="$contracts_commit" \
            ./scripts/generate-release-report-candidate.sh

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/rtk_account_manager-${{ steps.version.outputs.version }}.tar.gz" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/rtk_account_manager-${{ steps.version.outputs.version }}.tar.gz" \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

  publish-image:
    name: Publish LKE image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select image tags
        id: image
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}/account-manager"
          short_sha="${GITHUB_SHA::12}"
          tags=("$image:sha-$short_sha")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=("$image:$GITHUB_REF_NAME")
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            tags+=("$image:$INPUT_VERSION")
          fi
          {
            printf 'image=%s\n' "$image"
            printf 'short_sha=%s\n' "$short_sha"
            printf 'tags<<EOF\n'
            printf '%s\n' "${tags[@]}"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build smoke image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "${{ steps.image.outputs.image }}:local-smoke" -f deploy/lke/Dockerfile .
          docker run --rm --entrypoint /bin/sh "${{ steps.image.outputs.image }}:local-smoke" -c \
            'test -x /app/rtk-account-manager && test -x /app/rtk-account-manager-migrate && test -d /app/migrations'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/lke/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write image manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/lke-image
          cat > .artifacts/lke-image/image-manifest.json <<JSON
          {
            "schema": "rtk-service-image/v1",
            "repository": "${GITHUB_REPOSITORY}",
            "image": "${{ steps.image.outputs.image }}",
            "source_commit": "${GITHUB_SHA}",
            "primary_tag": "sha-${{ steps.image.outputs.short_sha }}"
          }
          JSON
          {
            echo "## LKE image"
            echo
            echo "\`\`\`json"
            cat .artifacts/lke-image/image-manifest.json
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: image-manifest
          path: .artifacts/lke-image/image-manifest.json
          if-no-files-found: error
