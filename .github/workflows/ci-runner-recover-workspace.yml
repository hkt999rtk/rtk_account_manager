name: Recover Workspace CI Runner

on:
  workflow_dispatch:
  push:
    branches:
      - codex/self-hosted-linux-x64-runner
    paths:
      - .github/workflows/ci-runner-recover-workspace.yml

permissions:
  contents: read

jobs:
  recover:
    name: Restart workspace runner service
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Restart only the workspace runner service
        shell: bash
        run: |
          set -euo pipefail
          workspace_unit="$({
            systemctl list-unit-files --type=service --no-legend
          } | awk '$1 ~ /^actions\.runner\./ && $1 ~ /rtk_cloud_workspace/ { print $1; exit }')"
          test -n "$workspace_unit"
          echo "Restarting $workspace_unit"
          sudo systemctl restart "$workspace_unit"
          sleep 5
          sudo systemctl is-active --quiet "$workspace_unit"
          sudo systemctl status "$workspace_unit" --no-pager
